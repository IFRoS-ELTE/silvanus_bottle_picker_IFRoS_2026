[develop]
script_dir=$base/lib/bottle_perception
[install]
install_scripts=$base/lib/bottle_perception
# Usa el python3 "activo" (el del entorno virtual con YOLO) en vez de /usr/bin/python3.
# Truco recomendado por la documentacion de ROS 2 para usar venvs.
[build_scripts]
executable = /usr/bin/env python3
